# ─────────────────────────────────────────────────────────────────────────────
# Decap CMS Configuration — Invendis Website
#
# SETUP STEPS (one-time, done by a developer):
#
# 1. Create a GitHub OAuth App:
#    GitHub → Settings → Developer Settings → OAuth Apps → New OAuth App
#      Application name : Invendis CMS
#      Homepage URL     : https://<your-github-pages-url>
#      Callback URL     : https://<your-github-pages-url>/admin/
#
# 2. Replace the two placeholders below:
#    - repo    : YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
#    - app_id  : the Client ID from the OAuth App you just created
#
# 3. Commit and push. The admin UI will be live at /admin.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: ananthr99/INVENDIS-Technologies
  branch: main

# Where uploaded images are stored in the repo / served from
media_folder: public/images/uploads
public_folder: /images/uploads

# ─────────────────────────────────────────────────────────────────────────────
# Reusable anchor for the full icon list — keeps the selects in sync with
# src/utils/iconMap.js without copy-pasting per field.
# ─────────────────────────────────────────────────────────────────────────────
icon_options: &icon_options
  - signal
  - sun
  - zap
  - network
  - dashboard
  - cpu
  - target
  - eye
  - lightbulb
  - flask
  - users
  - shield_check
  - globe
  - building
  - factory
  - microscope
  - map_pin
  - mail
  - phone
  - monitor
  - power
  - box
  - radio
  - wrench
  - arrow_left_right
  - shield
  - tv
  - plug
  - settings
  - bar_chart
  - smartphone
  - receipt
  - bell
  - trending_up
  - cloud
  - file_text
  - lock
  - leaf

colour_options: &colour_options [blue, red, green, purple, amber]

# ─────────────────────────────────────────────────────────────────────────────
# CTA Banner — reused on every page; defined once as an anchor
# ─────────────────────────────────────────────────────────────────────────────
cta_banner_fields: &cta_banner_fields
  - { name: heading,       label: Heading,                    widget: string }
  - { name: description,   label: Description,                widget: text   }
  - { name: primaryLabel,  label: Primary Button Label,       widget: string }
  - { name: primaryTo,     label: Primary Button Path,        widget: string }

cta_banner_with_secondary: &cta_banner_with_secondary
  - { name: heading,        label: Heading,                   widget: string }
  - { name: description,    label: Description,               widget: text   }
  - { name: primaryLabel,   label: Primary Button Label,      widget: string }
  - { name: primaryTo,      label: Primary Button Path,       widget: string }
  - { name: secondaryLabel, label: Secondary Button Label,    widget: string }
  - { name: secondaryTo,    label: Secondary Button Path,     widget: string }

# ─────────────────────────────────────────────────────────────────────────────
# Hero — shared structure across most pages
# ─────────────────────────────────────────────────────────────────────────────
hero_fields: &hero_fields
  - { name: eyebrow,        label: Eyebrow (small tag),       widget: string }
  - { name: headline,       label: Headline,                  widget: string }
  - { name: headlineAccent, label: Headline Accent (coloured),widget: string }
  - { name: description,    label: Description,               widget: text   }

collections:

  # ═══════════════════════════════════════════════════════════════════════════
  # SITE SETTINGS  →  src/content/siteSettings.json
  # ═══════════════════════════════════════════════════════════════════════════
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site Settings
        file: src/content/siteSettings.json
        fields:
          - name: logos
            label: Logos
            widget: object
            fields:
              - { name: invendis,    label: Invendis Logo Path,     widget: string }
              - { name: silbo,       label: SILBO Logo Path,        widget: string }
              - { name: makeInIndia, label: Make in India Logo Path, widget: string }

          - name: nav
            label: Navigation
            widget: object
            fields:
              - name: links
                label: Nav Links
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: to,    label: Path,  widget: string }
              - { name: contactCta, label: Contact Button Label, widget: string }

          - name: contact
            label: Contact Details
            widget: object
            fields:
              - { name: email,         label: Email,        widget: string }
              - { name: phone,         label: Phone,        widget: string }
              - { name: phoneHref,     label: Phone href,   widget: string }
              - { name: address,       label: Address,      widget: text   }
              - { name: foreignOffice, label: Foreign Office, widget: string }
              - name: websites
                label: Website Links
                widget: list
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url,   label: URL,   widget: string }

          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline,   label: Tagline,   widget: text   }
              - { name: copyright, label: Copyright, widget: string }
              - name: linkGroups
                label: Footer Link Groups
                widget: list
                fields:
                  - { name: title, label: Group Title, widget: string }
                  - name: links
                    label: Links
                    widget: list
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: to,    label: Path,  widget: string }

  # ═══════════════════════════════════════════════════════════════════════════
  # PAGES
  # ═══════════════════════════════════════════════════════════════════════════
  - name: pages
    label: Pages
    files:

      # ── HOME  →  src/content/pages/home.json ──────────────────────────────
      - name: home
        label: Home Page
        file: src/content/pages/home.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow,        label: Eyebrow,               widget: string }
              - { name: headline,       label: Headline,              widget: string }
              - { name: headlineAccent, label: Headline Accent,       widget: string }
              - { name: description,    label: Description,           widget: text   }
              - name: primaryCta
                label: Primary CTA
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: to,    label: Path,  widget: string }
              - name: secondaryCta
                label: Secondary CTA
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: to,    label: Path,  widget: string }
              - name: stats
                label: Hero Stats
                widget: list
                fields:
                  - { name: value, label: Value, widget: string }
                  - { name: label, label: Label, widget: string }
              - name: cards
                label: Highlight Cards
                widget: list
                fields:
                  - { name: title, label: Card Title, widget: string }
                  - name: tags
                    label: Tags
                    widget: list
                    fields:
                      - { name: label,  label: Tag Label,  widget: string  }
                      - { name: accent, label: Highlighted, widget: boolean }

          - name: clientsBar
            label: Clients Bar
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: clients
                label: Client Names
                widget: list
                field: { name: item, label: Client Name, widget: string }

          - name: whatWeDo
            label: What We Do Section
            widget: object
            fields:
              - { name: eyebrow,        label: Eyebrow,        widget: string }
              - { name: heading,        label: Heading,        widget: string }
              - { name: headingAccent,  label: Heading Accent, widget: string }
              - { name: description,    label: Description,    widget: text   }
              - name: features
                label: Features
                widget: list
                fields:
                  - name: icon
                    label: Icon
                    widget: select
                    options: *icon_options
                  - name: accent
                    label: Accent Colour
                    widget: select
                    options: *colour_options
                  - { name: title,       label: Title,       widget: string }
                  - { name: description, label: Description, widget: text   }

          - name: stats
            label: Stats Strip
            widget: list
            fields:
              - { name: value, label: Value, widget: string }
              - name: accent
                label: Accent Colour
                widget: select
                options: [blue, red]
              - { name: label, label: Label, widget: string }

          - name: testimonials
            label: Testimonials
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - name: items
                label: Testimonials
                widget: list
                fields:
                  - { name: initials, label: Initials (2 letters), widget: string }
                  - { name: name,     label: Full Name,             widget: string }
                  - { name: role,     label: Role & Company,        widget: string }
                  - { name: quote,    label: Quote,                 widget: text   }

          - name: ctaBanner
            label: CTA Banner
            widget: object
            fields: *cta_banner_with_secondary

      # ── COMPANY  →  src/content/pages/company.json ────────────────────────
      - name: company
        label: Company Page
        file: src/content/pages/company.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields: *hero_fields

          - name: missionSection
            label: Mission Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }

          - name: mission
            label: Mission / Vision / Tagline Cards
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: bg
                label: Background Colour
                widget: select
                options: *colour_options
              - { name: title, label: Title, widget: string }
              - { name: body,  label: Body,  widget: text   }

          - name: valuesSection
            label: Values Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }

          - name: values
            label: Values
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - { name: title, label: Title, widget: string }
              - { name: body,  label: Body,  widget: text   }

          - name: timelineSection
            label: Timeline Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }

          - name: timeline
            label: Timeline Entries
            widget: list
            fields:
              - { name: year,  label: Year / Period, widget: string }
              - { name: title, label: Title,         widget: string }
              - { name: body,  label: Body,          widget: text   }

          - name: facilitiesSection
            label: Facilities Section Headings
            widget: object
            fields:
              - { name: eyebrow,     label: Eyebrow,     widget: string }
              - { name: heading,     label: Heading,     widget: string }
              - { name: description, label: Description, widget: text   }

          - name: facilities
            label: Facilities
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: color
                label: Colour
                widget: select
                options: [blue, red, muted]
              - { name: label,  label: Label,  widget: string }
              - { name: detail, label: Detail, widget: string }

          - name: certifications
            label: Certifications
            widget: list
            field: { name: item, label: Certification, widget: string }

          - name: teamSection
            label: Team Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }

          - name: team
            label: Team Members
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - name: photo
                label: Photo
                widget: image
                required: false

          - name: ctaBanner
            label: CTA Banner
            widget: object
            fields: *cta_banner_with_secondary

      # ── SECTORS  →  src/content/pages/sectors.json ────────────────────────
      - name: sectors
        label: Sectors Page
        file: src/content/pages/sectors.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields: *hero_fields

          - name: sectors
            label: Sectors
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: iconBg
                label: Icon Background Colour
                widget: select
                options: *colour_options
              - { name: featured, label: Featured (large card),  widget: boolean, required: false, default: false }
              - { name: chip,     label: Chip Label (e.g. "Core Vertical"), widget: string, required: false }
              - { name: alt,      label: Alt background style,  widget: boolean, required: false, default: false }
              - { name: title,    label: Title,                 widget: string }
              - { name: desc,     label: Description,           widget: text   }
              - name: solutions
                label: Solutions List
                widget: list
                field: { name: item, label: Solution, widget: string }
              - { name: clients, label: Clients (e.g. "Nokia · Ericsson"), widget: string, required: false }

          - name: globalReachSection
            label: Global Reach Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }

          - name: regions
            label: Regions
            widget: list
            fields:
              - { name: title,     label: Region Name,               widget: string }
              - { name: countries, label: Countries (comma-separated), widget: string }

          - name: ctaBanner
            label: CTA Banner
            widget: object
            fields: *cta_banner_with_secondary

      # ── PRODUCTS  →  src/content/pages/products.json ──────────────────────
      - name: products
        label: Products Page
        file: src/content/pages/products.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow,        label: Eyebrow,        widget: string }
              - { name: headline,       label: Headline,       widget: string }
              - { name: headlineAccent, label: Headline Accent, widget: string }
              - { name: description,    label: Description,    widget: text   }
              - name: cta
                label: CTA Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: to,    label: Path,  widget: string }

          - name: hardwareSection
            label: Hardware Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }

          - name: hardwareProducts
            label: Hardware Products
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - { name: badge,    label: Badge Text (e.g. "Flagship"), widget: string,  required: false }
              - { name: badgeRed, label: Badge Red,                    widget: boolean                  }
              - { name: title,    label: Title,                        widget: string                   }
              - { name: desc,     label: Description,                  widget: text                     }
              - name: tags
                label: Spec Tags
                widget: list
                field: { name: item, label: Tag, widget: string }

          - name: silboSection
            label: SILBO Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }
              - { name: intro,         label: Intro Paragraph, widget: text  }

          - name: silboProducts
            label: SILBO Products
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - { name: title, label: Title,       widget: string }
              - { name: desc,  label: Description, widget: text   }

          - name: softwareSection
            label: Software Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }

          - name: softwarePlatforms
            label: Software Platforms
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: accent
                label: Accent Colour
                widget: select
                options: *colour_options
              - { name: title, label: Title,       widget: string }
              - { name: desc,  label: Description, widget: text   }

          - name: designPartnersSection
            label: Design Partners Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }

          - name: designPartners
            label: Design Partners
            widget: list
            field: { name: item, label: Partner Name, widget: string }

          - name: ctaBanner
            label: CTA Banner
            widget: object
            fields: *cta_banner_with_secondary

      # ── CASE STUDIES  →  src/content/pages/caseStudies.json ──────────────
      - name: case_studies
        label: Case Studies Page
        file: src/content/pages/caseStudies.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields: *hero_fields

          - name: caseStudiesSection
            label: Case Studies Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }

          - name: caseStudies
            label: Case Studies
            widget: list
            fields:
              - name: style
                label: Card Style
                widget: select
                options: [blue, mix, red]
              - { name: sector,      label: Sector Tag (e.g. "Telecom · Africa"), widget: string }
              - { name: title,       label: Title,                                widget: string }
              - { name: client,      label: Client Name,                          widget: string }
              - { name: desc,        label: Description,                          widget: text   }
              - { name: resultNum,   label: Result Number (e.g. "40%"),           widget: string }
              - { name: resultLabel, label: Result Label,                         widget: string }

          - name: whitepapersSection
            label: White Papers Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }

          - name: whitepapers
            label: White Papers
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: iconBg
                label: Icon Background Colour
                widget: select
                options: *colour_options
              - { name: title, label: Title,       widget: string }
              - { name: desc,  label: Description, widget: text   }

          - name: ctaBanner
            label: CTA Banner
            widget: object
            fields: *cta_banner_fields

      # ── CONTACT  →  src/content/pages/contact.json ────────────────────────
      - name: contact
        label: Contact Page
        file: src/content/pages/contact.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields: *hero_fields

          - name: contactItems
            label: Contact Info Items
            widget: list
            fields:
              - name: icon
                label: Icon
                widget: select
                options: *icon_options
              - name: color
                label: Colour
                widget: select
                options: [blue, red]
              - { name: label,   label: Label,                        widget: string }
              - { name: content, label: Display Text,                 widget: string }
              - { name: href,    label: Link href (optional),         widget: string, required: false }

          - name: quickFacts
            label: Quick Facts (badge strip)
            widget: list
            field: { name: item, label: Fact, widget: string }

          - name: form
            label: Contact Form Labels
            widget: object
            fields:
              - { name: heading,             label: Form Heading,          widget: string }
              - { name: nameLabel,           label: Name Field Label,      widget: string }
              - { name: namePlaceholder,     label: Name Placeholder,      widget: string }
              - { name: companyLabel,        label: Company Field Label,   widget: string }
              - { name: companyPlaceholder,  label: Company Placeholder,   widget: string }
              - { name: emailLabel,          label: Email Field Label,     widget: string }
              - { name: emailPlaceholder,    label: Email Placeholder,     widget: string }
              - { name: messageLabel,        label: Message Field Label,   widget: string }
              - { name: messagePlaceholder,  label: Message Placeholder,   widget: string }
              - { name: submitLabel,         label: Submit Button Label,   widget: string }

          - name: mapSection
            label: Map Section Headings
            widget: object
            fields:
              - { name: eyebrow,       label: Eyebrow,        widget: string }
              - { name: heading,       label: Heading,        widget: string }
              - { name: headingAccent, label: Heading Accent, widget: string }
              - { name: description,   label: Description,    widget: text   }
