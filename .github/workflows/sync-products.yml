name: Sync products from Product Selector

on:
  repository_dispatch:
    types: [product-sync]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync products
        run: node scripts/sync-from-ps.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/products/
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: sync products from Product Selector" && git push)
