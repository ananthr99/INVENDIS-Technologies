name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install main site dependencies
        run: npm install

      - name: Build main site
        run: npm run build
        env:
          VITE_BASE: /INVENDIS-Technologies/

      - name: Install admin dependencies
        run: npm install
        working-directory: ./cms-admin

      - name: Build admin
        run: npm run build
        working-directory: ./cms-admin

      - name: Copy admin build into dist
        run: cp -r ./cms-admin/dist ./dist/cms-admin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
